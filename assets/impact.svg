<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Impact: 900+ employees served, 10x faster cheque processing, 98.4% mAP, 40% faster query resolution, 15% less downtime, 12% wMAPE">
  <style>
    .f{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .c{animation:up .7s ease-out backwards}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .card{fill:#1a1b27;stroke:#414868}
    .n{font-size:38px;font-weight:800}
    .t{font-size:15px;fill:#c0caf5;font-weight:600}
    .s{font-size:13px;fill:#787c99}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g class="f">
    <g class="c">
      <rect class="card" x="0.5" y="0.5" width="319" height="114" rx="14"/>
      <rect x="0.5" y="16" width="4" height="82" rx="2" fill="#7aa2f7"/>
      <text class="n" x="24" y="52" fill="#7aa2f7">900+</text>
      <text class="t" x="24" y="78">employees across 20+ departments</text>
      <text class="s" x="24" y="98">use the enterprise RAG assistant I built</text>
    </g>
    <g class="c" style="animation-delay:.15s">
      <rect class="card" x="340.5" y="0.5" width="319" height="114" rx="14"/>
      <rect x="340.5" y="16" width="4" height="82" rx="2" fill="#9ece6a"/>
      <text class="n" x="364" y="52" fill="#9ece6a">10× faster</text>
      <text class="t" x="364" y="78">cheque processing before ERP</text>
      <text class="s" x="364" y="98">5 min → 30 s per cheque, fully automated</text>
    </g>
    <g class="c" style="animation-delay:.3s">
      <rect class="card" x="680.5" y="0.5" width="319" height="114" rx="14"/>
      <rect x="680.5" y="16" width="4" height="82" rx="2" fill="#bb9af7"/>
      <text class="n" x="704" y="52" fill="#bb9af7">98.4% mAP</text>
      <text class="t" x="704" y="78">real-time YOLOv10 site safety</text>
      <text class="s" x="704" y="98">on low-visibility industrial footage</text>
    </g>

    <g class="c" style="animation-delay:.45s">
      <rect class="card" x="0.5" y="135.5" width="319" height="114" rx="14"/>
      <rect x="0.5" y="151" width="4" height="82" rx="2" fill="#7dcfff"/>
      <text class="n" x="24" y="187" fill="#7dcfff">−40%</text>
      <text class="t" x="24" y="213">time to resolve technical queries</text>
      <text class="s" x="24" y="233">agentic RAG · LangGraph + Pinecone</text>
    </g>
    <g class="c" style="animation-delay:.6s">
      <rect class="card" x="340.5" y="135.5" width="319" height="114" rx="14"/>
      <rect x="340.5" y="151" width="4" height="82" rx="2" fill="#ff9e64"/>
      <text class="n" x="364" y="187" fill="#ff9e64">−15%</text>
      <text class="t" x="364" y="213">unplanned industrial downtime</text>
      <text class="s" x="364" y="233">Bi-LSTM predictive maintenance</text>
    </g>
    <g class="c" style="animation-delay:.75s">
      <rect class="card" x="680.5" y="135.5" width="319" height="114" rx="14"/>
      <rect x="680.5" y="151" width="4" height="82" rx="2" fill="#f7768e"/>
      <text class="n" x="704" y="187" fill="#f7768e">12% wMAPE</text>
      <text class="t" x="704" y="213">demand forecasting in production</text>
      <text class="s" x="704" y="233">LightGBM · per-SKU model selection</text>
    </g>
  </g>
</svg>
